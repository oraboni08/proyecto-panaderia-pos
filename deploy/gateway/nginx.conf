# API Gateway (Nginx): única puerta de entrada al sistema.
# Según el inicio de la ruta reenvía la petición al microservicio que corresponde.
# Los nombres (auth-service, catalog-service...) los resuelve el DNS interno de Docker Swarm,
# que además reparte las peticiones entre las réplicas de cada servicio.

# DNS interno de Docker. Con "resolver" + variables, Nginx resuelve el nombre en cada
# petición: si un servicio aún no ha arrancado, el gateway no se cae, solo responde 502.
resolver 127.0.0.11 valid=10s ipv6=off;

log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'upstream=$upstream_addr tiempo=$request_time';

server {
    listen 80 default_server;

    access_log /var/log/nginx/access.log gateway;
    client_max_body_size 5m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;

    # Si una réplica falla, Nginx reintenta la petición en otra.
    proxy_next_upstream error timeout http_502 http_503;

    location /api/v1/auth/ {
        set $auth http://auth-service:8001;
        proxy_pass $auth;
    }

    location /api/v1/catalog/ {
        set $catalog http://catalog-service:8002;
        proxy_pass $catalog;
    }

    location /api/v1/sales/ {
        set $sales http://sales-service:8003;
        proxy_pass $sales;
    }

    location /api/v1/reports/ {
        set $reports http://reporting-service:8004;
        proxy_pass $reports;
    }

    # Estado del propio gateway (para el healthcheck).
    location = /gateway/health {
        default_type application/json;
        return 200 '{"status": "ok", "service": "gateway"}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"detail": "Ruta no encontrada"}';
    }

    # Todo lo demás es la interfaz web.
    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
    }
}

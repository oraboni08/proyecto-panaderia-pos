<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Venta · Pan del Valle</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="pos-app">
    <header class="top">
      <div style="display:flex;align-items:center;gap:10px" id="brand"></div>
      <div class="sep"></div>
      <div style="display:flex;align-items:center;gap:10px">
        <span class="av solid" id="cajero-ini"></span>
        <div class="meta"><b id="cajero-nombre"></b><span>Cajero · Caja 1</span></div>
      </div>
      <div class="sep hide-md"></div>
      <div class="meta hide-md"><b id="turno"></b><span id="turno-horas"></span></div>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:8px" class="muted hide-md">
        <span id="ico-clock"></span>
        <div class="meta" style="text-align:right"><b class="num" id="reloj" style="color:var(--text)"></b><span id="fecha"></span></div>
      </div>
      <div class="sep"></div>
      <a class="tlink" href="/cajero/historial.html" id="mis-ventas"></a>
      <button class="ibtn bordered" type="button" data-theme-toggle></button>
      <button class="tlink ghost" type="button" id="logout"></button>
    </header>

    <div class="pos-body">
      <main class="pos-main">
        <label class="search">
          <span class="muted" id="ico-search"></span>
          <input type="search" id="buscar" placeholder="Buscar producto…" aria-label="Buscar producto" autocomplete="off">
          <span class="kbd" title="Atajo para buscar">/</span>
        </label>
        <div class="chips" role="tablist" aria-label="Categorías" id="chips"></div>
        <div class="products" id="products"></div>
      </main>

      <aside class="panel" aria-label="Venta actual">
        <div style="display:flex;align-items:center;justify-content:space-between;min-height:36px">
          <h2 style="margin:0;font-size:19px;font-weight:800">Venta actual</h2>
          <button class="tlink ghost" type="button" id="cancelar" style="height:36px;padding:0 8px;font-size:13px;color:var(--muted)" hidden>Cancelar <span class="kbd">Esc</span></button>
        </div>

        <div style="display:flex;gap:8px">
          <button class="csel" type="button" id="cliente-btn" aria-haspopup="listbox" aria-expanded="false"></button>
          <button class="btn2" type="button" id="nuevo-cliente"></button>
        </div>

        <div class="drop" id="cliente-drop" role="listbox" aria-label="Seleccionar cliente" hidden>
          <label class="search" style="height:48px;box-shadow:none">
            <span class="muted" id="ico-search2"></span>
            <input type="search" id="cliente-buscar" placeholder="Nombre, cédula o celular" aria-label="Buscar cliente" style="font-size:15px" autocomplete="off">
          </label>
          <div id="cliente-opts" style="display:flex;flex-direction:column;margin-top:6px;max-height:320px;overflow-y:auto"></div>
        </div>

        <div class="lines" id="lines"></div>

        <div style="display:flex;justify-content:space-between;align-items:flex-end">
          <div style="display:flex;flex-direction:column;gap:2px">
            <span class="lbl">Total</span>
            <span class="num muted" style="font-size:13px" id="unidades">0 unidades</span>
          </div>
          <span class="num" style="font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1" id="total">$0</span>
        </div>

        <div class="paygrid" role="radiogroup" aria-label="Método de pago" id="pagos"></div>

        <div id="efectivo" style="display:flex;flex-direction:column;gap:8px">
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
            <label class="cashbox"><span class="k">Recibido</span><input type="text" inputmode="numeric" id="recibido" aria-label="Valor recibido en efectivo" placeholder="$0"></label>
            <div class="cashbox change" id="cambio-box"><span class="k" id="cambio-lbl">Cambio</span><span class="num" style="flex:1;text-align:right;font-size:20px;font-weight:800" id="cambio">$0</span></div>
          </div>
          <div style="display:flex;gap:8px" id="rapidos"></div>
        </div>

        <button class="cobrar" type="button" id="cobrar" disabled><span class="num" id="cobrar-txt">Cobrar $0</span><span class="kbd">F2</span></button>
      </aside>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/fotos.js"></script>
  <script src="/js/clientes-form.js"></script>
  <script src="/js/venta.js"></script>
</body>
</html>

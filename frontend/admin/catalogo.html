<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo · Pan del Valle</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="side" id="side" aria-label="Menú principal"></nav>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Catálogo</h1>
          <p id="resumen">Productos de la vitrina y sus precios</p>
        </div>
        <button class="btn p" type="button" id="nuevo"></button>
      </div>

      <div class="card">
        <div class="toolbar">
          <label class="srch"><span class="muted" id="ico-buscar"></span><input type="search" id="buscar" placeholder="Buscar por nombre o código" aria-label="Buscar producto"></label>
          <select class="sel" id="categoria" aria-label="Categoría"><option value="">Todas las categorías</option></select>
          <div class="seg" id="estado" role="tablist" aria-label="Estado">
            <button type="button" data-e="activos" class="on">Activos</button>
            <button type="button" data-e="inactivos">Inactivos</button>
            <button type="button" data-e="todos">Todos</button>
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl head-bg">
            <thead><tr><th>Código</th><th>Producto</th><th>Categoría</th><th class="r">Precio</th><th>Disponible en caja</th><th class="r">Acciones</th></tr></thead>
            <tbody id="filas"></tbody>
          </table>
        </div>
        <div class="tbl-foot">
          <span id="conteo"></span>
          <span style="display:flex;align-items:center;gap:6px"><span id="ico-info"></span>Los productos no se eliminan: se desactivan para conservar el historial de ventas.</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/fotos.js"></script>
  <script src="/js/catalogo.js"></script>
</body>
</html>

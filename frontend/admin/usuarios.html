<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios · Pan del Valle</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="shell">
    <nav class="side" id="side" aria-label="Menú principal"></nav>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>Usuarios</h1>
          <p id="resumen">Quién puede entrar al sistema</p>
        </div>
        <button class="btn p" type="button" id="nuevo"></button>
      </div>

      <div class="card">
        <div class="toolbar">
          <label class="srch"><span class="muted" id="ico-buscar"></span><input type="search" id="buscar" placeholder="Buscar por nombre o usuario" aria-label="Buscar usuario"></label>
          <div class="seg" id="rol" role="tablist" aria-label="Rol">
            <button type="button" data-r="" class="on">Todos</button>
            <button type="button" data-r="cajero">Cajeros</button>
            <button type="button" data-r="admin">Administradores</button>
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl head-bg">
            <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Creado</th><th>Acceso</th></tr></thead>
            <tbody id="filas"></tbody>
          </table>
        </div>
        <div class="tbl-foot">
          <span id="conteo"></span>
          <span style="display:flex;align-items:center;gap:6px"><span id="ico-info"></span>Los usuarios no se eliminan: se desactivan para conservar quién registró cada venta.</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/usuarios.js"></script>
</body>
</html>

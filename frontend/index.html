<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panadería POS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥐</text></svg>">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="login-page">
    <div class="card login-card">
      <div class="logo">🥐</div>
      <h1>Panadería POS</h1>
      <p class="subtitle">Bienvenido, ingresa con tu usuario</p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>

        <div id="error" class="alert hidden" role="alert"></div>

        <button class="btn btn-primary btn-lg" type="submit" id="submit">Ingresar</button>
        <p class="hint" style="text-align:center;margin-top:14px">Acceso para administradores y cajeros</p>
      </form>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>

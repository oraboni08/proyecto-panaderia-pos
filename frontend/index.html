<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pan del Valle · Panadería POS</title>
  <link rel="icon" href="/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login">
    <section class="login-art">
      <div class="lb" id="art-logo"></div>
      <svg class="illu" viewBox="0 0 520 360" role="img" aria-label="Ilustración de pandebonos y pan aliñado recién horneados sobre una tabla">
        <ellipse cx="260" cy="300" rx="236" ry="34" fill="#7E3A19"/>
        <rect x="40" y="226" width="440" height="74" rx="37" fill="#86411E"/>
        <g stroke="#F3D9A8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85">
          <path d="M430 230C440 170 452 120 470 70"/>
          <path d="M455 112c-12-4-18-14-17-24c11 2 18 12 17 24zM461 96c12-5 17-15 15-25c-10 3-16 13-15 25zM449 140c-12-4-18-14-17-24c11 2 18 12 17 24zM456 124c12-5 17-15 15-25c-10 3-16 13-15 25zM466 74c-6-8-6-18 0-25c6 7 6 17 0 25z"/>
          <path d="M400 236C404 190 404 150 396 108"/>
          <path d="M398 150c-11-6-15-17-12-26c10 4 15 15 12 26zM402 132c11-7 14-18 10-27c-9 5-13 16-10 27zM397 112c-4-9-2-19 5-25c5 8 3 18-5 25z"/>
        </g>
        <g transform="rotate(-12 300 190)">
          <rect x="190" y="150" width="240" height="78" rx="39" fill="#C9813A"/>
          <rect x="200" y="156" width="220" height="40" rx="20" fill="#D9984D"/>
          <path d="M240 162l22 52M290 160l22 56M340 160l22 56M388 164l16 44" stroke="#A35F27" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g><circle cx="140" cy="214" r="62" fill="#E3A44A"/><circle cx="128" cy="198" r="44" fill="#ECB867"/><circle cx="116" cy="186" r="18" fill="#F3CB86"/><path d="M100 240c20 14 58 14 80-6" stroke="#C47F2C" stroke-width="4" stroke-linecap="round" fill="none"/></g>
        <g><circle cx="250" cy="246" r="50" fill="#DE9C40"/><circle cx="240" cy="233" r="35" fill="#E9B260"/><circle cx="231" cy="223" r="14" fill="#F1C77F"/></g>
        <g><circle cx="70" cy="262" r="36" fill="#D99538"/><circle cx="63" cy="253" r="25" fill="#E6AC57"/></g>
        <g fill="#B8722A" opacity="0.7"><circle cx="160" cy="232" r="3"/><circle cx="176" cy="210" r="2.5"/><circle cx="148" cy="250" r="2"/><circle cx="270" cy="262" r="2.5"/><circle cx="262" cy="276" r="2"/><circle cx="84" cy="278" r="2"/></g>
      </svg>
      <div>
        <h2>Tu panadería,<br>en orden.</h2>
        <p>Ventas, catálogo y clientes en un solo lugar. Hecho para el mostrador de la panadería del barrio.</p>
      </div>
    </section>

    <section class="login-form">
      <div style="display:flex;justify-content:flex-end"><button class="ibtn" type="button" data-theme-toggle></button></div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <form id="login-form" novalidate>
          <div style="display:flex;flex-direction:column;gap:8px">
            <span class="eyebrow">Panadería POS</span>
            <h1>Ingresa a tu turno</h1>
            <p class="muted" style="margin:0">Usa el usuario y la contraseña que te asignó el administrador.</p>
          </div>

          <div class="alert" id="error" role="alert" hidden></div>

          <div class="fld">
            <label for="usuario">Usuario</label>
            <div class="inp" id="usuario-box">
              <span class="muted" id="ico-user"></span>
              <input id="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
            </div>
          </div>

          <div class="fld">
            <div style="display:flex;justify-content:space-between;align-items:baseline">
              <label for="password">Contraseña</label>
              <a href="#" id="olvide" style="font-size:13px;font-weight:600">¿La olvidaste?</a>
            </div>
            <div class="inp" id="password-box">
              <span class="muted" id="ico-lock"></span>
              <input id="password" type="password" autocomplete="current-password">
              <button class="ibtn" type="button" id="ver" style="margin-right:-10px" aria-label="Mostrar contraseña"></button>
            </div>
          </div>

          <button class="btn p lg" type="submit" id="submit">Ingresar</button>
        </form>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12px" class="muted">
        <span>Panadería POS v2.0</span>
        <span>Pan del Valle · Cali</span>
      </div>
    </section>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/session.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>

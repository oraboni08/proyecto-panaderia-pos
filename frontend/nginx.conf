# Nginx del front-end: sirve la interfaz (HTML, CSS, JS e imágenes).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # JS y CSS sin caché para ver siempre la última versión.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Las fotos de los productos sí se guardan en caché.
    location /img/ {
        expires 7d;
    }
}
